<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E202B" />
      <stop offset="100%" stop-color="#12131A" />
    </linearGradient>
    <linearGradient id="chatgptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10A37F" />
      <stop offset="100%" stop-color="#16CC9B" />
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="grokGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#2A2F42" stroke-width="2.5" />

  <!-- Left Sidebar Panel -->
  <path d="M 8 30 Q 8 8 30 8 L 42 8 L 42 120 L 30 120 Q 8 120 8 98 Z" fill="#1E212E" />

  <!-- Sidebar Mockup Lines -->
  <rect x="12" y="22" width="18" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="32" width="22" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="42" width="15" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="52" width="20" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="62" width="16" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="72" width="22" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="82" width="14" height="3.5" rx="1.8" fill="#41485F" />
  <rect x="12" y="92" width="19" height="3.5" rx="1.8" fill="#41485F" />

  <!-- Resize Divider Rail -->
  <line x1="42" y1="8" x2="42" y2="120" stroke="#32384E" stroke-width="2" />

  <!-- Resize Slider Knob -->
  <rect x="36" y="47" width="12" height="34" rx="6" fill="#F0F4FC" stroke="#282E40" stroke-width="1.5" filter="url(#shadow)" />
  <line x1="42" y1="58" x2="42" y2="70" stroke="#788296" stroke-width="1.2" />
  <polygon points="40,64 37,61.5 37,66.5" fill="#282E40" />
  <polygon points="44,64 47,61.5 47,66.5" fill="#282E40" />

  <!-- 3-Platform Queued Prompt Cards -->
  <!-- 1. ChatGPT Emerald -->
  <g filter="url(#shadow)">
    <rect x="52" y="18" width="66" height="25" rx="7.5" fill="url(#chatgptGrad)" />
    <!-- Chat Bubble -->
    <rect x="59" y="24" width="16" height="13" rx="3.5" fill="#FFFFFF" fill-opacity="0.95" />
    <polygon points="62,37 66,37 61,40" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="80" y="25.5" width="30" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="80" y="32.5" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.75" />
  </g>

  <!-- 2. Claude Amber -->
  <g filter="url(#shadow)">
    <rect x="52" y="51" width="66" height="25" rx="7.5" fill="url(#claudeGrad)" />
    <!-- Chat Bubble -->
    <rect x="59" y="57" width="16" height="13" rx="3.5" fill="#FFFFFF" fill-opacity="0.95" />
    <polygon points="62,70 66,70 61,73" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="80" y="58.5" width="30" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="80" y="65.5" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.75" />
  </g>

  <!-- 3. Grok Cyan -->
  <g filter="url(#shadow)">
    <rect x="52" y="84" width="66" height="25" rx="7.5" fill="url(#grokGrad)" />
    <!-- Chat Bubble -->
    <rect x="59" y="90" width="16" height="13" rx="3.5" fill="#FFFFFF" fill-opacity="0.95" />
    <polygon points="62,103 66,103 61,106" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="80" y="91.5" width="30" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="80" y="98.5" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.75" />
  </g>
</svg>
