<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Web Supporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="eyebrow popup-brand">AI CHAT WEB SUPPORTER</div>
      <div class="popup-header-tools">
        <span id="extension-version" class="extension-version" aria-label="Extension version"></span>
        <label class="theme-switch" for="theme-toggle" title="Toggle light and dark mode">
          <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
          <span class="theme-switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </header>

    <section class="setting-section" aria-label="Queue settings">
      <div class="section-title">QUEUE</div>
      <label class="toggle-row" for="queue-enabled">
        <span class="shortcut-copy"><strong>Message queue</strong><small>Queue prompts with the shortcut</small></span>
        <span class="switch">
          <input id="queue-enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <fieldset class="shortcut-list" aria-label="Queue shortcut">
      <label class="shortcut-option">
        <input type="radio" name="queue-shortcut" value="ctrl-enter">
        <span>Ctrl + Enter</span>
      </label>
      <label class="shortcut-option">
        <input type="radio" name="queue-shortcut" value="alt-enter">
        <span>Alt + Enter</span>
      </label>
    </fieldset>

    <section class="setting-section" aria-label="Background settings">
      <div class="section-title">BACKGROUND</div>
      <label class="toggle-row" for="background-keep-awake">
        <span class="shortcut-copy"><strong>Keep device awake</strong><small>Prevent idle sleep; display may turn off</small></span>
        <span class="switch">
          <input id="background-keep-awake" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <section class="setting-section" aria-label="ChatGPT continuation settings">
      <div class="section-title">CHATGPT</div>
      <label class="toggle-row" for="auto-continue-enabled">
        <span class="shortcut-copy"><strong>Continue on response text</strong><small>Send “continue remaining works” on match · all sites</small></span>
        <span class="switch">
          <input id="auto-continue-enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
      <label class="text-setting-row" for="auto-continue-match-text">
        <span class="shortcut-copy"><strong>Trigger text</strong><small>Case-insensitive · whitespace ignored</small></span>
        <input id="auto-continue-match-text" class="text-setting-input" type="text" placeholder="Incompleted" autocomplete="off" spellcheck="false">
      </label>
      <label class="toggle-row" for="chatgpt-error-auto-continue">
        <span class="shortcut-copy"><strong>Error recovery</strong><small>Continue after ChatGPT stream errors</small></span>
        <span class="switch">
          <input id="chatgpt-error-auto-continue" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <section class="setting-section" aria-label="Claude settings">
      <div class="section-title">CLAUDE</div>
      <label class="toggle-row" for="claude-auto-continue">
        <span class="shortcut-copy"><strong>Auto-continue tools</strong><small>Continue after the per-turn tool limit</small></span>
        <span class="switch">
          <input id="claude-auto-continue" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <footer class="popup-footer">Local settings · GitHub update check</footer>

    <section id="update-notice" class="update-notice" role="status" aria-live="polite" hidden>
      <span class="update-copy">New version released — <strong id="update-version"></strong></span>
      <a id="update-download" class="update-download" href="#" aria-label="Download update source ZIP" title="Download source ZIP">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2" />
        </svg>
      </a>
    </section>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../queue/core.js"></script>
  <script src="update.js"></script>
  <script src="popup.js"></script>
</body>
</html>
