<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Web Supporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="eyebrow">AI CHAT WEB SUPPORTER</div>
      <h1>Queue shortcut</h1>
      <p>Choose the keybinding that moves the current text prompt into the local queue.</p>
    </header>

    <section class="setting-section" aria-label="Queue settings">
      <div class="section-title">QUEUE</div>
      <label class="toggle-row" for="queue-enabled">
        <span class="shortcut-copy"><strong>Message queue</strong><small>Queue shortcut prompts instead of sending them directly</small></span>
        <span class="switch">
          <input id="queue-enabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <fieldset class="shortcut-list" aria-label="Queue shortcut">
      <label class="shortcut-row">
        <span class="shortcut-copy"><strong>Ctrl + Enter</strong><small>Queue the current prompt</small></span>
        <input type="radio" name="queue-shortcut" value="ctrl-enter">
      </label>
      <label class="shortcut-row">
        <span class="shortcut-copy"><strong>Alt + Enter</strong><small>Queue the current prompt</small></span>
        <input type="radio" name="queue-shortcut" value="alt-enter">
      </label>
    </fieldset>

    <section class="setting-section" aria-label="Claude settings">
      <div class="section-title">CLAUDE</div>
      <label class="toggle-row" for="claude-auto-continue">
        <span class="shortcut-copy"><strong>Auto-continue tools</strong><small>Click Continue when Claude reaches its per-turn tool-use limit</small></span>
        <span class="switch">
          <input id="claude-auto-continue" type="checkbox">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <footer class="popup-footer">Text only · stored locally · no network access</footer>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../queue/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
